[project]
name = "ai-backend-production-starter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manuel Blinkert", email = "82281928+manuelblinkert@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "openai>=2.36.0",
    "pydantic-settings>=2.14.1",
    "python-json-logger>=4.1.0",
    "uvicorn>=0.47.0",
]

[project.scripts]
ai-backend-production-starter = "ai_backend_production_starter:main"

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
